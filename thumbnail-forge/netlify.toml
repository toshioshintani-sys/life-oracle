[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# FLUX は Replicate の非同期処理（polling）があるため長めに設定
[functions."generate-flux"]
  timeout = 60

[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 5173

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
