[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# v2 プレビュー用コンテキスト（PR プレビューではv2アプリを表示）
[context.deploy-preview]
  base = "life-oracle-v2"
  command = "npm install && npm run build"
  publish = "dist"

# get_metrics function に CSV を同梱（バンドル時にコピーされる）
[functions."get_metrics"]
  included_files = ["cockpit-data/daily_metrics.csv"]

# Cockpit (W1) は /cockpit/ 配下で公開（Netlify Identity でアクセス制限）
# Netlify Identity を有効にする手順（俊雄さん側）:
#   Netlify dashboard → Site settings → Identity → Enable Identity
#   Registration: Invite only
#   External providers: Google を有効化
#   その後 Identity → Invite users で toshio.shintani@gmail.com を招待

[[redirects]]
  from = "/cockpit"
  to = "/cockpit/index.html"
  status = 200

# 既存の診断アプリ (SPA fallback)。/cockpit/* と /.netlify/* は除外
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Path = ["!/cockpit/*", "!/.netlify/*"]}
