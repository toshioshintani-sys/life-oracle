name: Committee 14:00 Meeting

# 2026-07-13: 毎日の schedule 実行を停止。
# 委員会の実行方式は 2026-07-09 にローカル週次タスク
# (LifeOracle_Committee_Weekly / scripts/committee_native/) へ移行済みで、
# このワークフローは移行後も失敗し続け、成果ゼロの Slack 通知と
# GitHub の失敗通知メールだけを毎日発生させていた。無効化は俊雄さんの判断。
# 再開する場合は下記 schedule のコメントを外す。
on:
  # schedule:
  #   - cron: '0 5 * * *'  # 毎日 14:00 JST = 05:00 UTC
  workflow_dispatch: {}   # 手動テストは引き続き可能

jobs:
  meeting:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # LEDGER.md の自動コミット用
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run committee meeting (14:00)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          COMMITTEE_MODEL:   ${{ secrets.COMMITTEE_MODEL }}
        run: python scripts/committee.py --phase meeting
