name: Committee 10:00 Research

# 2026-07-13: 毎日の schedule 実行を停止。
# 委員会の実行方式は 2026-07-09 にローカル週次タスク
# (LifeOracle_Committee_Weekly / scripts/committee_native/) へ移行済みで、
# このワークフローは移行後も失敗し続け、成果ゼロの Slack 通知と
# GitHub の失敗通知メールだけを毎日発生させていた。無効化は俊雄さんの判断。
# 再開する場合は下記 schedule のコメントを外す。
on:
  # schedule:
  #   - cron: '0 1 * * *'  # 毎日 10:00 JST = 01:00 UTC
  workflow_dispatch: {}   # 手動テストは引き続き可能

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # reports/ の自動コミット用
      actions:  read    # engine 担当が CI 状態を読む用
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install optional GA4 client
        run: pip install google-analytics-data 2>/dev/null || true

      - name: Run committee research (10:00)
        env:
          ANTHROPIC_API_KEY:       ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL:       ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_TOKEN:            ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY:       ${{ github.repository }}
          COMMITTEE_MODEL:         ${{ secrets.COMMITTEE_MODEL }}
          # 任意: data 担当の実データ
          GA4_PROPERTY_ID:         ${{ secrets.GA4_PROPERTY_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: python scripts/committee.py --phase research
