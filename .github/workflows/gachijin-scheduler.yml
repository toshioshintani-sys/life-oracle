name: Gachijin Scheduler

on:
  schedule:
    - cron: '0 6 * * *'  # 15:00 JST every day
  workflow_dispatch: {}   # Allow manual trigger for testing

jobs:
  check-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check schedule and dispatch pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_ACTIONS_TOKEN: ${{ secrets.GITHUB_ACTIONS_TOKEN }}
          # GITHUB_REPOSITORY is automatically provided by GitHub Actions
        run: python scripts/gachijin_scheduler_trigger.py
