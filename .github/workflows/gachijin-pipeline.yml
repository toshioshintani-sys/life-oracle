name: Gachijin Pipeline

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Supabase jobs.id
        required: true
        type: string
      dry_run:
        description: Skip external paid/posting steps
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Japanese fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run orchestrator
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTE_SESSION_TOKEN: ${{ secrets.NOTE_SESSION_TOKEN }}
          NOTE_USERNAME: ${{ secrets.NOTE_USERNAME }}
        run: |
          python -X utf8 scripts/gachijin_orchestrator.py \
            --job-id "${{ inputs.job_id }}" \
            ${{ inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gachijin-${{ inputs.job_id }}
          path: var/gachijin/jobs/${{ inputs.job_id }}/
          if-no-files-found: warn
          retention-days: 14
